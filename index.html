<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: inkcube:"
    />
    <title>墨方 InkCube</title>
    <style>
      /* 启动加载屏：index.html 解析即显示，填平「窗口已开 → JS bundle 加载解析
         → React 挂载」之间的白屏期（2026-10-10）。纯 CSS 无 JS（CSP script-src
         'self' 禁内联脚本）；置于 #root 内，React 首渲自动替换，无需清理代码。
         配色与 src/styles/global.css :root 同值，避免转场跳色；html/body/#root
         撑满视口须内联声明——global.css 随 bundle 加载，在此之前无样式可用。 */
      html, body, #root { height: 100%; margin: 0; }
      .bootstrap-splash {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #ffffff;
        color: #1a1a1a;
        font-family: "Inter", "Noto Sans SC", -apple-system, sans-serif;
        user-select: none;
      }
      .bootstrap-splash-spinner {
        width: 36px;
        height: 36px;
        border: 3px solid #ececec;
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: bootstrap-splash-spin 0.8s linear infinite;
      }
      @keyframes bootstrap-splash-spin {
        to { transform: rotate(360deg); }
      }
      .bootstrap-splash-brand {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
      .bootstrap-splash-hint {
        font-size: 13px;
        color: #6b6b6b;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- 启动加载屏（React 挂载后被替换）；双语静态文案：i18n 此时尚未加载 -->
      <div class="bootstrap-splash">
        <div class="bootstrap-splash-spinner"></div>
        <div class="bootstrap-splash-brand">墨方 InkCube</div>
        <div class="bootstrap-splash-hint">正在启动 · Loading…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
