appId: com.inkcube.app
# 纯 ASCII：productName 决定 exe/安装包/安装目录/打包版 userData 路径，
# 中文会在脚本、日志、第三方工具链上引发编码问题（用户要求目录不含中文）
productName: InkCube

directories:
  output: dist
  buildResources: resources

files:
  - "electron/**/*"
  - "dist-renderer/**/*"
  - "package.json"

extraResources:
  # Backend code + site-packages (packaging plan B, 0.2 §9 — no PyInstaller;
  # assembled by scripts/build-installer.ps1 Step 2)
  - from: "resources/python-backend/"
    to: "python-backend/"
    filter:
      - "**/*"
  # Agent toolchain incl. python-build-standalone (also runs the backend)
  - from: "resources/tools/"
    to: "tools/"
    filter:
      - "**/*"
  - from: "resources/templates/"
    to: "templates/"
    filter:
      - "**/*"
  # Built-in skill sources (2.8 §4.2) — seed.py._locate_source() 第一候选是
  # INKCUBE_RESOURCES_DIR/skills/browser-fetch（= process.resourcesPath/skills），
  # 与本条 to: 目标对齐；缺这条则安装包内种子源缺失，动态抓取静默失效
  - from: "resources/skills/"
    to: "skills/"
    filter:
      - "**/*"
      - "!**/__pycache__/**"
  - from: "node_modules/mermaid/dist/mermaid.min.js"
    to: "mermaid/mermaid.min.js"
  # Mermaid renderer script — Python's mermaid bridge spawns it via the Electron
  # binary; must live outside app.asar (Python cannot read inside asar). Path is
  # injected as INKCUBE_MERMAID_RENDERER_SCRIPT (python-manager.js).
  - from: "electron/mermaid-renderer.js"
    to: "electron-renderer/mermaid-renderer.js"
  # NOTE: resources/base_libraries/ (preset base-lib seed files) intentionally
  # not bundled — preset libs start empty; users upload their own files (2.7 P3)

win:
  target: nsis
  icon: resources/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  shortcutName: 墨方 InkCube
  # 卸载时询问是否删除用户数据（默认保留，0.2 §3）：自定义宏在
  # resources/installer.nsh，RMDir 路径随 productName 变化需同步
  include: resources/installer.nsh
  # 无 electron-updater（手动分发），差分更新 blockmap 无人消费（孤儿产物），
  # 关闭省 ~600KB/版本（2026-10-25 复盘 #7）
  differentialPackage: false

mac:
  target: dmg
  icon: resources/icon.icns

linux:
  target: AppImage
  icon: resources/icon.png
