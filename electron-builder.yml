appId: com.inkcube.app
productName: 墨方 InkCube

directories:
  output: dist
  buildResources: resources

files:
  - "electron/**/*"
  - "dist-renderer/**/*"
  - "package.json"

extraResources:
  # Backend code + site-packages (packaging plan B, 0.2 §9 — no PyInstaller;
  # assembled by scripts/build-installer.ps1 Step 2)
  - from: "resources/python-backend/"
    to: "python-backend/"
    filter:
      - "**/*"
  # Agent toolchain incl. python-build-standalone (also runs the backend)
  - from: "resources/tools/"
    to: "tools/"
    filter:
      - "**/*"
  - from: "resources/templates/"
    to: "templates/"
    filter:
      - "**/*"
  - from: "node_modules/mermaid/dist/mermaid.min.js"
    to: "mermaid/mermaid.min.js"
  # NOTE: resources/base_libraries/ (preset base-lib seed files) intentionally
  # not bundled — preset libs start empty; users upload their own files (2.7 P3)

win:
  target: nsis
  icon: resources/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  shortcutName: 墨方 InkCube

mac:
  target: dmg
  icon: resources/icon.icns

linux:
  target: AppImage
  icon: resources/icon.png
